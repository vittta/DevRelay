name: Test and install

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'setuptools>=68' wheel
      - name: Build distributable
        run: python -m pip wheel --no-build-isolation --no-deps . --wheel-dir dist
      - name: Installed user flow
        run: python scripts/smoke_install.py dist/devrelay-*.whl
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - run: git diff --check
